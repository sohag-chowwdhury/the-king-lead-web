name: Bootstrap secure source
on:
  push:
    paths:
      - the-king-lead-web-source.zip
      - .github/workflows/bootstrap.yml
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source
        run: |
          unzip -o the-king-lead-web-source.zip
          rm the-king-lead-web-source.zip
          rm .github/workflows/bootstrap.yml
          rm .github/workflows/deploy-web.yml
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Install secure The King Lead PWA'
          git push
